name: Build Velopack Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Velopack package
        shell: pwsh
        run: .\publish-velopack-win-x64.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\WordleItaliano\releases\* `
            --title "Wordle Italiano $env:GITHUB_REF_NAME" `
            --notes "Aggiornamento Wordle Italiano $env:GITHUB_REF_NAME"
